name: ReaPack

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get install -yy pandoc

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install reapack-index
        run: gem install reapack-index

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate ReaPack index
        run: reapack-index --name "Arilia Scripts" --commit

      - name: Commit updated index
        if: github.event_name == 'push'
        run: |
          if git diff --quiet index.xml; then
            echo "index.xml is already up to date"
          else
            git add index.xml
            git commit -m "Update ReaPack index"
            git push
          fi