<!DOCTYPE html>
<html lang="en">
    <head>
        <title>ReaChords</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="../main.js"></script>
        <script src="js/chordslyrics.js"></script>
        <link rel="stylesheet" href="css/chordsandlyrics.css">
    </head>
    <body>
        <div class="top_bar">
            <div class="play_state stop" id="play_state">Stop</div>
            <h1 id="song_title" class ="song_title"></h1>
            <div class="scriptstatus" id="scriptstatus_div" onclick='wwr_req("_RSaf4c87ad0fe018f26bac592d415077460ebe7aad");'></div>
            <div class="bar_adjust" id="decrease_bars" title="Show fewer bars per row">−</div>
            <div class="bar_adjust" id="increase_bars" title="Show more bars per row">+</div>
            <div class="clock" id="clock_div"></div>
            
        </div>
        <div class="top_curtain">
        </div>
        
        <div class="position_row" id="position_row">
            <div id="position" class="position">&nbsp;</div>
        </div>
        
        <div id='song' class="song">
            <div id='chords' class='chords_table'></div>
        </div>
        
        <div id="loader" class="loader">Loading...</div>
        
        <div class="bottom_curtain"> </div>
        <div class="bottom_bar">
            <div class="lyrics_banner" id ="lyrics_banner"></div>
        </div>
        
    </body>
    <script>

        const song = new Song(Song.CHORDS);
        document.getElementById("increase_bars").addEventListener("click",  function f() {song.increaseBars()});
        document.getElementById("decrease_bars").addEventListener("click",  function f() {song.decreaseBars()});
    </script>
</html>
