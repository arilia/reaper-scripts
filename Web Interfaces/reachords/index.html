    <head>
        <title>ReaChords</title>

    <body>
        <nav class="tabs" role="tablist" aria-label="View">
            <button class="tab" role="tab" aria-selected="true" data-page="chords" id="change_to_chords" >Chords</button>
            <button class="tab" role="tab" aria-selected="false" data-page="lyrics" id="change_to_lyrics" >Lyrics</button>
            <button class="tab" role="tab" aria-selected="false" data-page="clock" id="change_to_clock" >Clock</button>

                <div class="scriptstatus_div" id="scriptstatus_div" >

                    <div id="scriptstatus" class="scriptstatus">
                    </div>
                </div>
                <button class="round-btn" id="decrease_bars" title="Show fewer bars per row">−</button>
                <button class="round-btn" id="increase_bars" title="Show more bars per row">+</button>

            </div>
            <div class="clock" id="clock_div"></div>
        </div>

                    <div id='song_chords' class="song_chords">

                    </div>
                    <!--<div class="bottom_curtain_chords" id="bottom_curtain_chords"> </div>-->

    </body>
    <script>

        const setList = new SetList();
        const viewManagerView = new ViewManager(setList);
        
        document.getElementById("increase_bars").addEventListener("click",  function f() {setList.viewManager.chordsView.increaseBars();});
        document.getElementById("decrease_bars").addEventListener("click",  function f() {setList.viewManager.chordsView.decreaseBars();});
        document.getElementById("decorated_chords").addEventListener("click",  function f() {setList.viewManager.chordsView.toggleDecoratedChords();});
        document.getElementById("change_to_lyrics").addEventListener("click",  function f() {setList.viewManager.changeLayout(ViewManager.LYRICS);});
        document.getElementById("change_to_chords").addEventListener("click",  function f() {setList.viewManager.changeLayout(ViewManager.CHORDS);});
        document.getElementById("change_to_clock").addEventListener("click",  function f() {setList.viewManager.changeLayout(ViewManager.CLOCK);});
        document.getElementById("change_to_setlist").addEventListener("click",  function f() {setList.viewManager.changeLayout(ViewManager.SETLIST);});
        document.getElementById("play_button").addEventListener("click",  function f() {setList.activeSong.play();});
//        document.getElementById("pause_button").addEventListener("click",  function f() {setList.activeSong.pause();});
        document.getElementById("stop_button").addEventListener("click",  function f() {setList.activeSong.stop();});
        document.getElementById("prev_bar_button").addEventListener("click",  function f() {setList.activeSong.prevBar();});
        document.getElementById("rewind_button").addEventListener("click",  function f() {setList.activeSong.rewind();});
        document.getElementById("forward_button").addEventListener("click",  function f() {setList.activeSong.forward();});
        document.getElementById("lock").addEventListener("click",  function f() {setList.activeSong.toggleLock();});
        document.getElementById("scriptstatus_div").addEventListener("click",  function f() {wwr_req("_RSaf4c87ad0fe018f26bac592d415077460ebe7aad");});
        
    </script>
